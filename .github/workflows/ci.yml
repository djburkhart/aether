name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Aether.sln

      - name: Build
        run: dotnet build Aether.sln --no-restore -c Release

      - name: DomGen smoke
        run: >
          dotnet run --no-build -c Release --project src/Aether.Atf.DomGen.Cli --
          testdata/atf/UsingDom/game.xsd
          testdata/atf/UsingDom/GameSchema.cs
          Game.UsingDom UsingDom --check

      - name: CircuitEditor DomGen smoke
        run: >
          dotnet run --no-build -c Release --project src/Aether.Atf.DomGen.Cli --
          testdata/atf/CircuitEditor/Circuit.xsd
          testdata/atf/CircuitEditor/Schema.cs
          http://sony.com/gametech/circuits/1_0 CircuitEditorSample --check

      - name: UsingDom sample
        run: dotnet run --no-build -c Release --project samples/UsingDom

      - name: Aether.Editor headless session
        run: dotnet run --no-build -c Release --project src/Aether.Editor -- --headless-session
